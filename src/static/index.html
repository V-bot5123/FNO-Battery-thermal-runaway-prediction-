<!DOCTYPE html>
<html>
<head>
    <title>FNO Battery Predictor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #121212; color: white; margin-top: 50px;}
        .container { display: flex; justify-content: center; gap: 80px; margin-top: 40px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        canvas { width: 300px; height: 300px; image-rendering: pixelated; border-radius: 5px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #E50914; color: white; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s;}
        button:hover { background: #ff1f2a; transform: scale(1.05); }
    </style>
</head>
<body>
    <h1>🔋 Battery Thermal Runaway Predictor</h1>
    <p style="color: #aaa; font-size: 18px;">Powered by Fourier Neural Operators (1000x Faster than FEA)</p>
    
    <button onclick="runSimulation()" id="simBtn">Simulate Random Defect</button>
    
    <div class="container">
        <div class="box">
            <h3 style="color: #ff9800;">Initial Sensor State (t=0)</h3>
            <p style="font-size: 14px; color: #888;">Factory detects a sudden hot spot</p>
            <canvas id="inputCanvas" width="64" height="64"></canvas>
        </div>
        <div class="box">
            <h3 style="color: #4CAF50;">AI Prediction (t=1)</h3>
            <p style="font-size: 14px; color: #888;">FNO predicts future heat spread</p>
            <canvas id="outputCanvas" width="64" height="64"></canvas>
        </div>
    </div>

    <script>
        // Heatmap color mapping function (Black -> Red -> Yellow -> White)
        function valToColor(v) {
            v = Math.max(0, Math.min(1, v)); 
            let r = Math.min(255, v * 3 * 255);
            let g = Math.min(255, Math.max(0, (v - 0.3) * 3 * 255));
            let b = Math.min(255, Math.max(0, (v - 0.6) * 5 * 255));
            return [r, g, b, 255];
        }

        function drawGrid(canvasId, gridData) {
            let canvas = document.getElementById(canvasId);
            let ctx = canvas.getContext('2d');
            let imgData = ctx.createImageData(64, 64);
            
            // The FNO might output values slightly out of bounds, so we normalize max value for display
            let maxVal = 0.01;
            for(let y=0; y<64; y++) {
                for(let x=0; x<64; x++) {
                    if (gridData[y][x] > maxVal) maxVal = gridData[y][x];
                }
            }

            for(let y=0; y<64; y++) {
                for(let x=0; x<64; x++) {
                    let val = gridData[y][x] / maxVal; // normalize to 0-1 for colors
                    let idx = (y * 64 + x) * 4;
                    let color = valToColor(val);
                    imgData.data[idx] = color[0];
                    imgData.data[idx+1] = color[1];
                    imgData.data[idx+2] = color[2];
                    imgData.data[idx+3] = color[3];
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Draw empty screens on load
        let emptyGrid = Array(64).fill().map(() => Array(64).fill(0));
        drawGrid('inputCanvas', emptyGrid);
        drawGrid('outputCanvas', emptyGrid);

        async function runSimulation() {
            document.getElementById('simBtn').innerText = "Predicting...";
            
            // Create a fake 64x64 grid with a random hot spot
            let grid = Array(64).fill().map(() => Array(64).fill(0));
            let cx = Math.floor(Math.random() * 40) + 10;
            let cy = Math.floor(Math.random() * 40) + 10;
            
            for(let y=0; y<64; y++) {
                for(let x=0; x<64; x++) {
                    let distSq = Math.pow(x-cx, 2) + Math.pow(y-cy, 2);
                    grid[y][x] = Math.exp(-distSq / 15.0); // Size of hot spot
                }
            }
            
            drawGrid('inputCanvas', grid);

            // Send to our Python API
            try {
                let res = await fetch('/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({grid: grid})
                });
                let data = await res.json();
                
                // Draw AI result
                drawGrid('outputCanvas', data.predicted_heat_grid);
            } catch (err) {
                alert("Error connecting to API. Is the server running?");
            }
            document.getElementById('simBtn').innerText = "Simulate Random Defect";
        }
    </script>
</body>
</html>
